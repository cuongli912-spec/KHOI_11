<style>
:root{--bg:#f6f8fb;--cd:#fff;--tx:#14213d;--mu:#5b6578;--ac:#2563eb;--r:#dc2626;--g:#16a34a;--ln:#d8dee9;--hl:#fff7d6}
@media(prefers-color-scheme:dark){:root{--bg:#0e1524;--cd:#16203a;--tx:#e8edf8;--mu:#9aa6bf;--ac:#7aa2ff;--r:#f87171;--g:#4ade80;--ln:#2a3858;--hl:#3a3012}}
*{box-sizing:border-box}html{font-size:28px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.top{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;gap:10px;align-items:center;padding:8px 14px}

.fs{display:flex;gap:4px;align-items:center;font-size:.6rem}
button{font:inherit;color:var(--tx)}
.fs button,.nav button,.ctl button{font-size:.6rem;background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:2px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;max-width:1500px;margin:auto;padding:14px}
.grid.one{grid-template-columns:1fr}.one .L{display:none}
@media(max-width:820px){.grid{grid-template-columns:1fr}.L{position:static!important}}
.L{position:sticky;top:56px;align-self:start}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px 16px}
h1{font-size:1.05rem;margin:0 0 6px}canvas{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px}
.mu{color:var(--mu);font-size:.6rem;margin:4px 0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.ctl .sl{font-size:.6rem;flex:1;min-width:230px;display:flex;flex-direction:column}.ctl input{width:100%}
.R p{margin:.4em 0}
.b{font:inherit;font-weight:700;color:var(--mu);background:none;border:none;border-bottom:2px dashed var(--mu);cursor:pointer;padding:0 6px;border-radius:0}
.b.on{color:var(--g);border-bottom:2px solid var(--g)}
table{border-collapse:collapse;width:100%;font-size:.8rem;margin:6px 0}th,td{border:1px solid var(--ln);padding:3px 8px;text-align:left}th{background:var(--hl)}
.k{background:var(--hl);border-left:6px solid #eab308;border-radius:0 10px 10px 0;padding:8px 14px;margin:10px 0;font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;font-size:.7rem;margin-bottom:6px}.row button{font-size:.6rem;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:2px 10px;cursor:pointer}
.q{border:1px solid var(--ln);border-radius:10px;padding:8px 14px;margin:10px 0;background:var(--cd)}
.q button{display:block;width:100%;text-align:left;font-size:.8rem;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:4px 10px;margin:5px 0;cursor:pointer}
.q button.ok{background:#16a34a33;border-color:var(--g)}.q button.no{background:#dc262633;border-color:var(--r)}
.nav{display:flex;justify-content:space-between;max-width:1500px;margin:auto;padding:0 14px 40px}.nav button:disabled{opacity:.35}
button:focus-visible{outline:2px solid var(--ac)}
</style>
</head>

var S=[
{t:'I. Sóng cơ: định nghĩa, phân loại',cap:'Bấm đổi sóng ngang / sóng dọc, theo dõi chấm đỏ.',
 ctl:[{t:'b',k:'dl',a:'〰️ Đang: sóng ngang (bấm để đổi)',b:'⋮⋮ Đang: sóng dọc (bấm để đổi)'}],
 d:function(C){var ng=!V.dl,k=T2/160,A=ng?30:12,ph=2.2*t,rows=ng?[0]:[-40,-20,0,20,40],mid=124;function D(x){return A*Math.sin(ph-k*x)}

  var x5=73.,d5=D(x5);dt(ng?x5:x5+d5,ng?mid+d5:mid,7,C.r);

 ctl:[{t:'b',k:'dir',a:'➡ Sóng truyền từ trái sang phải (bấm để đổi)',b:'⬅ Sóng truyền từ phải sang trái (bấm để đổi)'},{t:'r',k:'p',l:'Vị trí điểm M',min:.1,max:3,st:.05,v:1.25,u:' λ'},{t:'p',l:'Bước 1',k:'st',v:1},{t:'p',l:'Bước 2',k:'st',v:2},{t:'p',l:'Bước 3',k:'st',v:3},{t:'p',l:'Ẩn bước',k:'st',v:0},{t:'b',k:'ex',a:'🎯 Đang: quan sát (bấm để luyện tập)',b:'🎯 Đang: luyện tập (bấm để quay lại quan sát)'},{t:'f',l:'🎲 Đề mới',f:function(){nw()}},{t:'p',l:'M: ⬆ lên',k:'ans',v:1},{t:'p',l:'M: ⬇ xuống',k:'ans',v:2},{t:'p',l:'Sóng: ➡ sang phải',k:'ans',v:3},{t:'p',l:'Sóng: ⬅ sang trái',k:'ans',v:4}],

  var ym=Y(xm);dt(xm,ym,8,C.r);tx('M',xm+10,ym-10,C.r);

  var bt=null,rt=dir?'từ phải sang trái':'từ trái sang phải';

 h:'<p><b>1. Phương dao động so với phương truyền:</b> sóng ngang: {{vuông góc}}; sóng dọc: {{trùng}}.</p><p><b>2. Biết chiều truyền, tìm chiều chuyển động của M</b> (giả sử sóng truyền từ trái sang phải):<br><b>Bước 1:</b> xác định {{đáy sóng}} gần điểm M nhất.<br><b>Bước 2:</b> phía bên {{trái}} đáy là sườn {{trước}}; phía bên {{phải}} đáy là sườn {{sau}}.<br><b>Bước 3:</b> điểm nằm trên sườn trước {{đi lên}}; điểm nằm trên sườn sau {{đi xuống}}.<br>Sóng truyền từ phải sang trái: sườn trước nằm bên {{phải}} đáy, các bước còn lại làm tương tự.</p><p><b>3. Biết chiều chuyển động của M, tìm chiều truyền:</b> M đi lên (sườn trước) thì sóng truyền theo chiều {{từ M tới đáy gần nhất}}; M đi xuống (sườn sau) thì sóng truyền theo chiều {{từ đáy gần nhất tới M}}.</p><p><b>4.</b> Tại đỉnh và đáy, vận tốc của phần tử {{bằng 0}}; tại vị trí cân bằng, vận tốc {{lớn nhất}}.</p><div class="k"><b>Ghi nhớ nhanh:</b> đáy gần nhất → sườn trước / sườn sau → trước đi lên, sau đi xuống. Sóng truyền sang phải: bên trái đáy đi lên, bên phải đáy đi xuống.</div>',qs:1},
