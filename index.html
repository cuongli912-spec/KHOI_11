<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bài kiểm tra Vật lí</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1f2937;--ac:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#e5e7eb;--ac:#60a5fa}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Roboto,sans-serif}
.box{background:var(--card);padding:2rem 2.5rem;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.12);max-width:520px;text-align:center}
h1{margin:0 0 .5rem;color:var(--ac);font-size:1.6rem}
p{line-height:1.6;margin:.5rem 0}
</style>
</head>
<body>
<div class="box">
<h1>📘 Bài kiểm tra Vật lí</h1>
<p>Các em vui lòng truy cập bài kiểm tra bằng <b>đường link thầy gửi</b>.</p>
<p>Nếu chưa có link, hãy liên hệ thầy giáo bộ môn.</p>
</div>
</body>
</html>
